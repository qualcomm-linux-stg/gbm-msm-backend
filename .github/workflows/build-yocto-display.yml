name: Build Yocto for Display

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "Build SDK"
        required: false
        default: "0"
      profile:
        description: "Build profile (pr | full)"
        required: false
        default: "full"

  workflow_call:
    inputs:
      sdk:
        required: false
        type: string
        default: "0"
      profile:
        required: false
        type: string
        default: "full" # values: pr | full
    outputs:
      artifacts_url:
        description: "URL to retrieve build artifacts"
        value: ${{ jobs.compile.outputs.url }}

# Concurrency is used to prevent multiple workflows from running for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: true

env:
  KAS_CLONE_DEPTH: 1

jobs:
  kas-setup:
    if: |
      github.repository_owner == 'qualcomm-linux' ||
      github.repository_owner == 'qualcomm-linux-stg'
    runs-on: [self-hosted, gen-qlnx-stg-u2404-x64-lrg-od-ephem]
    steps:
      - name: Setting up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          LATEST=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/siemens/kas | tail -n1 | sed 's/.*\///')
          wget -qO ${KAS_CONTAINER} https://raw.githubusercontent.com/siemens/kas/refs/tags/$LATEST/kas-container
          chmod +x ${KAS_CONTAINER}

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Update base repos
        run: |
          echo "Fetching latest base.lock.yml from meta-qcom repository..."
          curl -s https://raw.githubusercontent.com/qualcomm-linux/meta-qcom/master/ci/base.lock.yml -o ci/base.lock.yml
          echo "Updated base.lock.yml with latest layer commits"
          cat ci/base.lock.yml

      - name: Run kas lock
        if: ${{ hashFiles('ci/base.lock.yml') == '' }}
        run: |
          ${KAS_CONTAINER} lock --update ci/base.yml:ci/qcom-distro.yml

      - name: Upload kas lockfile
        uses: actions/upload-artifact@v6
        with:
          name: kas-lockfile
          path: ci/*.lock.yml

      - name: Upload kas-container
        uses: actions/upload-artifact@v6
        with:
          name: kas-container
          path: ${{ env.KAS_CONTAINER }}

  yocto-run-checks:
    needs: kas-setup
    if: |
      github.repository_owner == 'qualcomm-linux' ||
      github.repository_owner == 'qualcomm-linux-stg'
    runs-on: [self-hosted, gen-qlnx-stg-u2404-x64-lrg-od-ephem]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download kas lockfile
        uses: actions/download-artifact@v7
        with:
          name: kas-lockfile
          path: ci

      - name: Download kas-container
        uses: actions/download-artifact@v7
        with:
          name: kas-container
          path: ${{ runner.temp }}

      - name: Setting up kas-container
        run: |
          KAS_CONTAINER=$RUNNER_TEMP/kas-container
          echo "KAS_CONTAINER=$KAS_CONTAINER" >> $GITHUB_ENV
          chmod +x $KAS_CONTAINER

      - name: Run Yocto patchreview
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-patchreview.sh

      - name: Run yocto-check-layer
        run: |
          ci/kas-container-shell-helper.sh ci/yocto-check-layer.sh

  compile_warm_up:
    timeout-minutes: 480
    needs: kas-setup
    if: |
      github.repository_owner == 'qualcomm-linux' ||
      github.repository_owner == 'qualcomm-linux-stg'
    runs-on: [self-hosted, gen-qlnx-stg-u2404-x64-lrg-od-ephem]
    strategy:
      fail-fast: true
      matrix:
        machine:
          - glymur-crd
        distro:
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
        kernel:
          - type: default
            dirname: ""
            yamlfile: ""
    name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run kas build
        uses: ./.github/actions/compile
        with:
          machine: ${{matrix.machine}}
          distro_yaml: ${{matrix.distro.yamlfile}}
          distro_name: ${{matrix.distro.name}}
          kernel_yaml: ${{matrix.kernel.yamlfile}}
          kernel_dirname: ${{matrix.kernel.dirname}}
          #cache_dir: ${{env.CACHE_DIR}}
          sdk: ${{inputs.sdk}}
          update_srcrev: "true"

  compile:
    timeout-minutes: 480
    needs: compile_warm_up
    if: |
      github.repository_owner == 'qualcomm-linux' ||
      github.repository_owner == 'qualcomm-linux-stg'
    runs-on: [self-hosted, gen-qlnx-stg-u2404-x64-lrg-od-ephem]
    outputs:
      url: ${{ steps.compile_kas.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        machine:
          - glymur-crd
        distro:
          - name: qcom-distro
            yamlfile: ':ci/qcom-distro.yml'
        kernel:
          - type: 6.18
            dirname: "_linux-qcom-6.18"
            yamlfile: ":ci/linux-qcom-6.18.yml"
        exclude:
          # Exclude jobs from compile_warm_up
          - machine: glymur-crd
            distro:
                name: nodistro
            kernel:
                type: default
          - machine: glymur-crd
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: nodistro
            kernel:
                type: default
          - machine: qcom-armv8a
            distro:
                name: qcom-distro
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: nodistro
            kernel:
                type: default
          - machine: rb3gen2-core-kit
            distro:
                name: qcom-distro
            kernel:
                type: default
    name: ${{ matrix.machine }}/${{ matrix.distro.name }}${{ matrix.kernel.dirname }}
    steps:
      - name: checkout
        if: inputs.profile != 'pr' || (matrix.distro.name != 'debug' && matrix.distro.name != 'performance')
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run kas build
        if: inputs.profile != 'pr' || (matrix.distro.name != 'debug' && matrix.distro.name != 'performance')
        uses: ./.github/actions/compile
        id: compile_kas
        with:
          machine: ${{matrix.machine}}
          distro_yaml: ${{matrix.distro.yamlfile}}
          distro_name: ${{matrix.distro.name}}
          kernel_yaml: ${{matrix.kernel.yamlfile}}
          kernel_dirname: ${{matrix.kernel.dirname}}
          #cache_dir: ${{env.CACHE_DIR}}
          sdk: ${{inputs.sdk}}
          update_srcrev: "true"

  publish_summary:
    needs: compile
    #if: ${{ always() && github.repository_owner == 'qualcomm-linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/print-build-output
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: build-url*

  build_successful:
    #if: github.repository_owner == 'qualcomm-linux'
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Build completed successfully
        run: echo "All compile matrix jobs succeeded and artifacts uploaded to S3 bucket"
